<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GroupDetail モック</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f0f0f0; display: flex; justify-content: center; padding: 24px; }

  .phone {
    width: 375px;
    height: 812px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 24px #0002;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ヘッダー */
  .header {
    padding: 12px 16px;
    border-bottom: 1px solid #ececec;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .back-btn {
    color: #bbb;
    font-size: 20px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .header-info .name { font-size: 15px; font-weight: 600; color: #111; }
  .header-info .seats { font-size: 11px; color: #bbb; margin-top: 1px; }

  /* タブ */
  .tabs {
    display: flex;
    border-bottom: 1px solid #ececec;
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    font-size: 13px;
    color: #bbb;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .tab.active { color: #111; font-weight: 600; border-color: #111; }

  /* コンテンツ */
  .content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

  /* 注文アイテム */
  .order-list { flex: 1; }
  .order-item {
    padding: 12px 16px;
    border-bottom: 1px solid #f5f5f5;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .order-item .info { flex: 1; }
  .order-item .item-name { font-size: 14px; color: #111; margin-bottom: 4px; }
  .order-item .item-name .qty { font-size: 12px; color: #aaa; margin-left: 4px; }
  .order-item .item-meta { display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
  }
  .badge-pending { background: #f5f5f5; color: #888; border: 1px solid #e0e0e0; }
  .badge-ready { background: #fef9e8; color: #92400e; border: 1px solid #fcd34d; }
  .badge-served { background: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }
  .item-price { font-size: 11px; color: #ccc; }

  .action-btn {
    font-size: 11px;
    padding: 5px 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn-complete { background: #fef9e8; color: #92400e; border: 1px solid #fcd34d; }
  .btn-serve { background: white; color: #aaa; border: 1px solid #e0e0e0; }
  .cancel-x { color: #ddd; font-size: 16px; background: none; border: none; cursor: pointer; padding: 2px 4px; }

  .section-label { padding: 10px 16px 6px; font-size: 11px; color: #aaa; letter-spacing: 0.05em; }

  .served-item {
    padding: 10px 16px;
    border-bottom: 1px solid #f5f5f5;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0.5;
  }
  .served-item .sname { flex: 1; font-size: 13px; color: #555; }
  .served-item .sqty { font-size: 11px; color: #bbb; }

  /* フッターエリア（注文履歴末尾に含まれる） */
  .footer-area {
    padding: 16px;
    border-top: 1px solid #ececec;
    background: #fafafa;
    flex-shrink: 0;
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .total-label { font-size: 13px; color: #888; }
  .total-amount { font-size: 20px; font-weight: 600; color: #111; }

  .bill-btn {
    width: 100%;
    padding: 14px;
    background: #111;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .checkout-link {
    display: block;
    text-align: center;
    font-size: 12px;
    color: #bbb;
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    padding: 4px;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- ヘッダー -->
  <div class="header">
    <span class="back-btn">←</span>
    <div class="header-info">
      <div class="name">テーブル A</div>
      <div class="seats">A-1・A-2・A-3</div>
    </div>
  </div>

  <!-- タブ -->
  <div class="tabs">
    <div class="tab active">注文履歴</div>
    <div class="tab">メニュー</div>
    <div class="tab">コース</div>
  </div>

  <!-- コンテンツ -->
  <div class="content">
    <div class="order-list">

      <!-- アクティブな注文 -->
      <div class="order-item">
        <div class="info">
          <div class="item-name">生ビール <span class="qty">×2</span></div>
          <div class="item-meta">
            <span class="badge badge-ready">提供待ち</span>
            <span class="item-price">¥550</span>
          </div>
        </div>
        <button class="action-btn btn-complete">提供完了</button>
        <button class="cancel-x">×</button>
      </div>

      <div class="order-item">
        <div class="info">
          <div class="item-name">唐揚げ <span class="qty">×1</span></div>
          <div class="item-meta">
            <span class="badge badge-pending">未調理</span>
            <span class="item-price">¥680</span>
          </div>
        </div>
        <button class="action-btn btn-serve">調理完了</button>
        <button class="cancel-x">×</button>
      </div>

      <div class="order-item">
        <div class="info">
          <div class="item-name">ハイボール <span class="qty">×3</span></div>
          <div class="item-meta">
            <span class="badge badge-pending">未調理</span>
            <span class="item-price">¥480</span>
          </div>
        </div>
        <button class="action-btn btn-serve">調理完了</button>
        <button class="cancel-x">×</button>
      </div>

      <!-- 提供済み -->
      <div class="section-label">提供済み</div>
      <div class="served-item">
        <span class="sname">枝豆</span>
        <span class="sqty">×1</span>
      </div>
      <div class="served-item">
        <span class="sname">お通し</span>
        <span class="sqty">×3</span>
      </div>

    </div>

    <!-- 合計 + アクションボタン -->
    <div class="footer-area">
      <div class="total-row">
        <span class="total-label">合計（参考）</span>
        <span class="total-amount">¥4,090</span>
      </div>
      <button class="bill-btn">お会計</button>
      <button class="checkout-link">退店する</button>
    </div>
  </div>

</div>
</body>
</html>
